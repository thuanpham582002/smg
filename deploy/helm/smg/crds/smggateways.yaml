apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: smggateways.smg.lightseek.io
spec:
  group: smg.lightseek.io
  names:
    kind: SmgGateway
    listKind: SmgGatewayList
    plural: smggateways
    singular: smggateway
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                routing:
                  type: object
                  properties:
                    policy:
                      type: string
                      enum: [cache_aware, round_robin, power_of_two, least_load, manual, random, prefix_hash, consistent_hashing, bucket, passthrough, weighted_sticky]
                serviceDiscovery:
                  type: object
                  properties:
                    pods:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        selector:
                          type: string
                        namespace:
                          type: string
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        modelIdFrom:
                          type: string
                    crds:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                modelSelector:
                  type: object
                  properties:
                    headerName:
                      type: string
                routes:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                extAuth:
                  type: object
                  properties:
                    serviceName:
                      type: string
                      default: regional-auth-backend
                    namespace:
                      type: string
                    path:
                      type: string
                      default: /ext-auth
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 8080
                    url:
                      type: string
                    timeoutMs:
                      type: integer
                      minimum: 1
                      default: 500
                    failOpenOnTransportError:
                      type: boolean
                      default: false
                config:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                ready:
                  type: boolean
                reason:
                  type: string
      subresources:
        status: {}
